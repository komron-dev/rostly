spring:
  application:
    name: Rostly - Honest Exam Platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
    name: ${APP_ADMIN_NAME}

  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiry: ${APP_JWT_ACCESS_TOKEN_EXPIRY}
    refresh-token-expiry: ${APP_JWT_REFRESH_TOKEN_EXPIRY}
    verify-email-token-expiry: ${APP_JWT_VERIFY_EMAIL_TOKEN_EXPIRY}
    change-email-token-expiry: ${APP_JWT_CHANGE_EMAIL_TOKEN_EXPIRY}

  storage:
    photos-dir: ${APP_STORAGE_PHOTOS_DIR}
    answers-dir: ${APP_STORAGE_ANSWERS_DIR}
    violations-dir: ${APP_STORAGE_VIOLATIONS_DIR}

  session:
    default-trust-score: ${APP_SESSION_DEFAULT_TRUST_SCORE}
#logging.level.web: DEBUG